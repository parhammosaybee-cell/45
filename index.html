<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PM Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#eaf3ff;color:#173451}.app{max-width:1050px;height:100dvh;min-height:550px;margin:auto;background:#fff;display:flex;flex-direction:column;box-shadow:0 8px 40px #17416b18}.top{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#147df5,#1266d6);color:#fff;padding:14px 18px}.logo{width:43px;height:43px;background:#fff;color:#147df5;border-radius:14px;display:grid;place-items:center;font-weight:bold;font-size:18px}.brand{flex:1}.brand b{font-size:18px}.brand small{display:block;opacity:.85;margin-top:5px}.status{font-size:12px}.iconbtn{border:1px solid #ffffff66;background:#ffffff18;color:white;border-radius:12px;padding:10px;cursor:pointer;font:inherit}.main{display:flex;flex:1;min-height:0}.sidebar{width:285px;border-left:1px solid #e3edf8;background:#f7fbff;padding:18px;display:flex;flex-direction:column;gap:13px}.profilecard{background:#fff;border:1px solid #e1ebf7;border-radius:18px;padding:16px;text-align:center;box-shadow:0 4px 15px #1d4d7b08}.avatar{width:82px;height:82px;border-radius:50%;overflow:hidden;display:grid;place-items:center;margin:0 auto 10px;background:#d9ebff;color:#147df5;font-weight:bold;font-size:24px;border:3px solid #c6e2ff}.avatar img,.smallav img{width:100%;height:100%;object-fit:cover}.profilecard b{display:block}.profilecard p{font-size:12px;color:#7d91a9;line-height:1.7;overflow-wrap:anywhere}.action{border:0;border-radius:11px;padding:10px 12px;background:#e8f2ff;color:#1268c9;font:13px Tahoma;cursor:pointer}.action.primary{background:#147df5;color:white}.settings{border:1px solid #e1ebf7;border-radius:16px;background:white;padding:14px}.settings h3{font-size:14px;margin:0 0 12px}.settings label{display:block;font-size:12px;color:#637c97;margin:10px 0 6px}.settings input,.settings textarea,.namebar input{width:100%;border:1px solid #dbe7f4;border-radius:10px;padding:10px;font:13px Tahoma;outline-color:#147df5}.settings textarea{resize:vertical;min-height:60px}.note{font-size:11px;color:#91a3b8;line-height:1.7}.chat{flex:1;display:flex;flex-direction:column;min-width:0}.roomhead{padding:14px 18px;border-bottom:1px solid #e7eff8;display:flex;align-items:center;gap:10px}.roomicon{width:40px;height:40px;border-radius:14px;background:#e3f0ff;color:#147df5;display:grid;place-items:center}.roomhead b{font-size:14px}.roomhead small{display:block;color:#8197ae;margin-top:4px}.namebar{padding:10px 16px;background:#fbfdff;border-bottom:1px solid #edf2f8;display:flex;gap:8px}.namebar input{flex:1;min-width:0}.messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:13px;background-color:#f3f9ff;background-image:radial-gradient(#dbeafa 1px,transparent 1px);background-size:18px 18px}.msgrow{display:flex;gap:8px;align-items:flex-end;align-self:flex-start;max-width:95%}.smallav{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;display:grid;place-items:center;background:#d9ebff;color:#147df5;font-size:11px;font-weight:bold}.bubble{background:white;border:1px solid #e1ebf6;border-radius:15px 15px 15px 5px;padding:10px 13px;box-shadow:0 2px 8px #183e6509;overflow-wrap:anywhere}.who{font-size:12px;color:#147df5;font-weight:bold;margin-bottom:5px}.bio{font-size:10px;color:#859bb2;margin-bottom:5px}.body{font-size:14px;line-height:1.8;white-space:pre-wrap}.time{font-size:10px;color:#8da0b5;text-align:left;margin-top:5px}.system{align-self:center;background:#e2efff;color:#6483a4;padding:7px 13px;border-radius:20px;font-size:11px}.compose{padding:12px;display:flex;gap:9px;border-top:1px solid #e3edf7}.compose input{flex:1;min-width:0;border:1px solid #dce8f4;border-radius:13px;padding:13px;font:inherit;outline-color:#147df5}.compose button{border:0;border-radius:13px;padding:0 19px;background:#147df5;color:white;font:inherit;cursor:pointer}.foot{text-align:center;color:#93a5b8;font-size:10px;padding:0 6px 7px}#file{display:none}.toast{font-size:12px;color:#16724a;min-height:16px}@media(max-width:760px){.app{height:100dvh}.main{flex-direction:column}.sidebar{width:auto;border-left:0;border-bottom:1px solid #e3edf8;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.profilecard{padding:10px;display:grid;grid-template-columns:56px 1fr;align-items:center;text-align:right;column-gap:10px}.avatar{width:52px;height:52px;margin:0;grid-row:span 2}.profilecard p{margin:3px 0}.profilecard .action{grid-column:1/-1;margin-top:8px}.settings{padding:10px}.settings h3{margin-bottom:5px}.settings label{margin:6px 0 4px}.settings textarea{min-height:42px}.top{padding:10px}.brand b{font-size:16px}.messages{padding:12px}.compose{padding:8px}.compose button{padding:0 12px}.status{display:none}}
</style></head><body><main class="app">
<header class="top"><div class="logo">PM</div><div class="brand"><b>PM Chat</b><small>پیام‌رسان عمومی</small></div><span class="status" id="status">در حال اتصال…</span><button class="iconbtn" id="settingsJump" title="تنظیمات">⚙ تنظیمات</button></header>
<div class="main"><aside class="sidebar">
<section class="profilecard"><div class="avatar" id="bigAvatar">PM</div><div><b id="profileName">کاربر</b><p id="profileBio">پروفایل عمومی</p></div><button class="action" id="pickPhoto">📷 تعویض عکس پروفایل</button><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></section>
<section class="settings" id="settings"><h3>⚙ تنظیمات پروفایل</h3><label for="username">نام نمایشی</label><input id="username" maxlength="24" placeholder="نامی که همه می‌بینند"><label for="bioInput">دربارهٔ من</label><textarea id="bioInput" maxlength="160" placeholder="چند کلمه دربارهٔ خودت…"></textarea><label for="theme">رنگ برنامه</label><select id="theme" style="width:100%;border:1px solid #dbe7f4;border-radius:10px;padding:10px;font:13px Tahoma"><option value="blue">آبی روشن</option><option value="violet">بنفش</option><option value="mint">سبزآبی</option></select><button class="action primary" id="saveProfile" style="width:100%;margin-top:12px">ذخیره تنظیمات</button><div class="toast" id="toast"></div><p class="note">عکس و نام کنار پیام‌ها برای دیگران نمایش داده می‌شوند. نام نمایشی در این نسخه رمز عبور یا ورود امن نیست.</p></section>
</aside><section class="chat"><div class="roomhead"><div class="roomicon">🌐</div><div><b>چت عمومی</b><small>همهٔ کاربران می‌توانند پیام‌ها را ببینند</small></div></div><div class="namebar"><input id="quickName" maxlength="24" placeholder="نام نمایشی"><button class="action" id="quickSave">ثبت نام</button></div><section class="messages" id="messages"><div class="system">در حال اتصال به چت عمومی…</div></section><form class="compose" id="form"><input id="text" maxlength="1000" placeholder="پیامت را بنویس…" autocomplete="off"><button type="submit">ارسال ➤</button></form><div class="foot">PM Chat · چت عمومی</div></section></div></main>
<script>
const $=id=>document.getElementById(id);const msgs=$('messages'),statusEl=$('status');let socket,retry=1000,avatarUrl=localStorage.getItem('pmchat-avatar')||'',username=localStorage.getItem('pmchat-name')||'کاربر',bio=localStorage.getItem('pmchat-bio')||'';
$('username').value=username;$('quickName').value=username;$('bioInput').value=bio;
function paint(el,url,name){el.innerHTML='';if(url){const img=document.createElement('img');img.src=url;img.alt='عکس پروفایل';el.appendChild(img)}else el.textContent=(name||'PM').slice(0,2).toUpperCase()}
function renderProfile(){username=$('username').value.trim()||'کاربر';bio=$('bioInput').value.trim();$('profileName').textContent=username;$('profileBio').textContent=bio||'پروفایل عمومی';$('quickName').value=username;paint($('bigAvatar'),avatarUrl,username);localStorage.setItem('pmchat-name',username);localStorage.setItem('pmchat-bio',bio)}
renderProfile();
$('settingsJump').onclick=()=>$('settings').scrollIntoView({behavior:'smooth',block:'nearest'});
$('pickPhoto').onclick=()=>$('file').click();
$('quickSave').onclick=()=>{$('username').value=$('quickName').value;renderProfile();$('toast').textContent='نام نمایشی در این مرورگر ثبت شد؛ برای انتشار پروفایل روی ذخیره تنظیمات بزن.'};
$('saveProfile').onclick=async()=>{renderProfile();const fd=new FormData();fd.append('username',username);fd.append('bio',bio);try{const r=await fetch('/api/profile',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw new Error(d.detail||'خطا');avatarUrl=d.avatar||avatarUrl;localStorage.setItem('pmchat-avatar',avatarUrl);paint($('bigAvatar'),avatarUrl,username);$('toast').textContent='تنظیمات پروفایل ذخیره شد.'}catch(e){$('toast').textContent='ذخیره نشد: '+e.message}};
$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;if(f.size>3*1024*1024){alert('حجم عکس باید کمتر از ۳ مگابایت باشد.');return}renderProfile();const fd=new FormData();fd.append('username',username);fd.append('bio',bio);fd.append('avatar',f);try{const r=await fetch('/api/profile',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw new Error(d.detail||'خطا');avatarUrl=d.avatar;localStorage.setItem('pmchat-avatar',avatarUrl);paint($('bigAvatar'),avatarUrl,username);$('toast').textContent='عکس پروفایل ذخیره شد و در پیام‌های جدید نمایش داده می‌شود.'}catch(e){alert('تعویض عکس ناموفق بود: '+e.message)}};
$('theme').value=localStorage.getItem('pmchat-theme')||'blue';$('theme').onchange=()=>{const t=$('theme').value;localStorage.setItem('pmchat-theme',t);document.documentElement.style.setProperty('--accent',t==='violet'?'#7857d5':t==='mint'?'#0c9b89':'#147df5');document.querySelector('.top').style.background=t==='violet'?'linear-gradient(120deg,#7857d5,#5438a8)':t==='mint'?'linear-gradient(120deg,#0c9b89,#087568)':'linear-gradient(120deg,#147df5,#1266d6');document.querySelectorAll('.action.primary,.compose button').forEach(x=>x.style.background='var(--accent)')};$('theme').onchange();
function addMessage(m){const row=document.createElement('div');row.className='msgrow';const av=document.createElement('div');av.className='smallav';paint(av,m.avatar,m.username);const bubble=document.createElement('article');bubble.className='bubble';const who=document.createElement('div');who.className='who';who.textContent=m.username||'کاربر';bubble.append(who);if(m.bio){const b=document.createElement('div');b.className='bio';b.textContent=m.bio;bubble.append(b)}const body=document.createElement('div');body.className='body';body.textContent=m.text||'';const time=document.createElement('div');time.className='time';time.textContent=m.created_at||'';bubble.append(body,time);row.append(av,bubble);msgs.appendChild(row);while(msgs.children.length>250)msgs.firstChild.remove();msgs.scrollTop=msgs.scrollHeight}
function connect(){const p=location.protocol==='https:'?'wss':'ws';socket=new WebSocket(`${p}://${location.host}/ws`);socket.onopen=()=>{statusEl.textContent='● متصل';retry=1000};socket.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='history'){msgs.innerHTML='';if(!d.messages.length){const s=document.createElement('div');s.className='system';s.textContent='هنوز پیامی نیست؛ اولین پیام را بفرست!';msgs.appendChild(s)}d.messages.forEach(addMessage)}else if(d.type==='message'){if(msgs.querySelector('.system'))msgs.innerHTML='';addMessage(d)}};socket.onclose=()=>{statusEl.textContent='اتصال قطع شد؛ تلاش دوباره…';setTimeout(connect,retry);retry=Math.min(retry*2,10000)};socket.onerror=()=>socket.close()}
connect();$('form').onsubmit=e=>{e.preventDefault();renderProfile();const text=$('text').value.trim();if(!text)return;if(!socket||socket.readyState!==WebSocket.OPEN){alert('اتصال برقرار نیست؛ چند لحظه صبر کن.');return}socket.send(JSON.stringify({username,text}));$('text').value=''};
</script></body></html>
